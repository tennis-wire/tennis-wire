# A task whose inputs have not changed takes its outputs from the build cache instead of running
# again: compiling, tests, SpotBugs and PMD alike. In CI the cache travels in the Gradle home that
# setup-gradle saves on main and restores on pull requests, so a change to one service does not
# rebuild and retest the others. ./gradlew build --rerun-tasks runs everything regardless.
org.gradle.caching=true
