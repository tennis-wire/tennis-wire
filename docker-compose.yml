# Local development infrastructure for tennis-wire.
#
#   docker compose up -d
#
# Application services are NOT here on purpose: they have no Dockerfiles yet
# and are expected to run from the IDE against this stack.
# Credentials below are local-only development defaults, not secrets.
#
# All ports are bound to 127.0.0.1: nothing here is meant to be reachable
# from the network, and MinIO in particular must not be (see its comment).

name: tennis-wire

services:
  # ============== PostgreSQL ==============
  # One instance, one database + one role per service.
  # See docker/postgres/init/01-create-databases.sh
  postgres:
    image: postgres:18-alpine
    container_name: tw-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ============== Redis ==============
  # Task queue for transcription-service (arq).
  redis:
    image: redis:8-alpine
    container_name: tw-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ============== MinIO (S3-compatible) ==============
  # Pinned by digest to the last community-edition image published to Docker
  # Hub. The MinIO CE repository was archived in April 2026: no new releases
  # and no official community images. Note that this image predates the final
  # CE security release (RELEASE.2025-10-15, privilege-escalation fix), which
  # was never published as an image — this MinIO is permanently unpatched and
  # must stay loopback-only. Local S3 emulator only; production object storage
  # is a separate decision.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: tw-minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"  # console (read-only object browser in CE)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ============== Bucket bootstrap ==============
  # The bucket stays private: results are served via presigned URLs, which
  # need no anonymous policy — locally as in production.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: tw-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/transcription
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
