# The site's look for every page Keycloak draws: sign-in, registration, password reset,
# email verification and the rest of the flow. Templates not overridden here come from base
# and are styled by css/login.css through the classes below and plain element selectors.
parent=base
import=common/keycloak
styles=css/login.css
locales=ru,en

kcBodyClass=tw-body
kcFormClass=tw-form
kcFormGroupClass=tw-field
kcFormGroupErrorClass=tw-field-invalid
kcLabelWrapperClass=tw-label-row
kcLabelClass=tw-label
kcInputWrapperClass=tw-input-wrap
kcInputClass=tw-input
kcInputGroup=tw-input-group
kcInputErrorMessageClass=tw-field-error
kcInputHelperTextBeforeClass=tw-hint
kcInputHelperTextAfterClass=tw-hint
kcCheckboxInputClass=tw-checkbox
kcFormSettingClass=tw-form-settings
kcFormOptionsClass=tw-form-options
kcFormOptionsWrapperClass=tw-form-options-inner
kcFormButtonsClass=tw-form-buttons
kcButtonClass=tw-button
kcButtonPrimaryClass=tw-button-primary
kcButtonDefaultClass=tw-button-secondary
kcButtonBlockClass=tw-button-block
kcAlertClass=tw-alert
kcAlertTitleClass=tw-alert-text
kcSignUpClass=tw-info
kcFormPasswordVisibilityButtonClass=tw-reveal
kcFormPasswordVisibilityIconShow=tw-reveal-show
kcFormPasswordVisibilityIconHide=tw-reveal-hide
kcFormSocialAccountListButtonDisabledClass=tw-social-busy
