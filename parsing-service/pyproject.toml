[project]
name = "parsing-service"
version = "0.1.0"
description = "News collector for Tennis Wire: feeds, article pages, extracted text"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tennis Wire Team" }]

dependencies = [
    # Scheduling and state
    "arq>=0.26",
    # HTTP
    "httpx>=0.28",
    # Feeds and pages
    "feedparser>=6.0",
    "trafilatura>=2.0",
    "lxml>=5.3",
    "cssselect>=1.2",            # CSS selectors in source profiles
    # Configuration
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    # Logging
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    # Testing
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",               # HTTP mocking
    "fakeredis>=2.26",
    # Linting & formatting
    "ruff>=0.8",
    "mypy>=1.13",
    # Type stubs
    "types-pyyaml>=6.0",
    "lxml-stubs>=0.5",
]

[project.scripts]
parsing = "parsing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parsing"]

# ============== RUFF ==============
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",        # pycodestyle errors
    "W",        # pycodestyle warnings
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "ASYNC",    # async linting
    "S",        # bandit (security) via ruff
    "PTH",      # use pathlib
    "LOG",      # logging
    "G",        # logging format
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============== MYPY ==============
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "arq.*",
    "feedparser.*",
    "trafilatura.*",
]
ignore_missing_imports = true

# ============== PYTEST ==============
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]
