# Source profiles: architecture/aggregator.md section 4.2.
# A new source is checked before it goes in: section 4.3.

sources:
  - key: tennis-majors
    name: Tennis Majors
    kind: rss
    url: https://www.tennismajors.com/feed
    hosts: [tennismajors.com]
    language: en
    interval: PT1M

  # Columns, not news. Paid posts reach the feed and the page cut short: a lead is all there is.
  - key: bounces
    name: Bounces (Ben Rothenberg)
    kind: rss
    url: https://www.benrothenberg.com/feed
    hosts: [benrothenberg.com]
    language: en
    interval: PT30M
    quiet_after: P10D

  # Eurosport: one platform, six editions with their own newsrooms. No RSS; the news sitemap
  # holds every sport for 48 hours, so tennis is picked by section and videos are dropped.
  # Checked on 10 articles each (architecture/aggregator.md 4.3): on the whole page the generic
  # extraction takes the byline, the "on Google" button, video teasers, related cards and the
  # promos at the end along with the text; the platform's data-testid markers drop them.
  - key: tnt-sports
    name: TNT Sports (Eurosport UK)
    kind: news_sitemap
    url: https://www.tntsports.co.uk/sitemaps/news/sitemap-news-recent.xml
    hosts: [tntsports.co.uk]
    language: en
    include: ['^https://www\.tntsports\.co\.uk/tennis/']
    exclude: ['_vid\d+/']
    interval: PT1M
    extract: &eurosport-extract
      # The body alone: with the page around it the generic extraction keeps or drops the
      # heading and the standfirst from one article to the next. The title comes from the
      # sitemap, the standfirst as the lead (og:description, cut at 160 characters).
      body: '[data-testid="body"]'
      drop:
        - '[data-testid="body-thumbnail"]'
        - '[data-testid="body-list"]'
        - '[data-testid="secondary-card-content"]'
      paragraph: '[data-testid="body-paragraph"], [data-testid="body-subtitle"]'
      drop_paragraphs:
        - 'HBO Max\.?$'
        - '^Add TNT Sports as a preferred source'
        - '^Download the TNT Sports app'
        - '^Das könnte Dich (auch|ebenfalls) interessieren'
        - '^Waar kijk je\?$'

