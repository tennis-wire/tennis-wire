spring:
  application:
    name: user-service

  datasource:
    # No stringtype=unspecified here, unlike content-service and discussion-service:
    # this schema uses no native PostgreSQL enum types and no ltree.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tennis_users}
    username: ${DB_USERNAME:users}
    password: ${DB_PASSWORD:users}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # No explicit dialect: Hibernate picks PostgreSQLDialect from the connection and
        # warns (HHH90000025) when it is spelled out anyway.
        format_sql: true
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  servlet:
    multipart:
      # The avatar is the only upload. A cropped square is a small fraction of this.
      max-file-size: 5MB
      max-request-size: 6MB

  security:
    oauth2:
      resourceserver:
        jwt:
          # Same issuer and audience as the gateway: the service
          # validates the token itself rather than trusting whoever forwarded it.
          # This holds for /internal/** too, which the gateway never routes.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/tennis-wire}
          audiences:
            - tennis-wire-api
      client:
        registration:
          # Calls this service makes as itself rather than on behalf of whoever is on the line:
          # Keycloak's admin API and the erase in discussion-service. One registration for both -
          # the token is the same whichever door it opens. The id is ServiceTokens.REGISTRATION_ID.
          service-account:
            provider: keycloak
            client-id: user-service
            client-secret: ${USER_SERVICE_CLIENT_SECRET:dev-user-service-secret}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            # token-uri, not issuer-uri: an issuer is looked up while the context starts, and then
            # neither the service nor any @SpringBootTest comes up without Keycloak.
            token-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/tennis-wire}/protocol/openid-connect/token

user:
  keycloak:
    # The server root, not the issuer: the admin API sits above the realm, and the issuer URI has
    # the realm in it already.
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:tennis-wire}
    connect-timeout: 2s
    read-timeout: 5s

  discussion-service:
    # Its own port over cluster DNS, not the gateway: /internal/** is deliberately not routed there.
    base-url: ${DISCUSSION_SERVICE_URL:http://localhost:8093}
    connect-timeout: 2s
    # Erasing a whole reader's worth of comments is more work than a lookup. Nobody waits on it
    # either way: the job has its own thread, and the call made when a reader asks to leave is
    # handed off to another one rather than kept on his.
    read-timeout: 15s

  avatar:
    # Read from the header before anything is decoded. Clients send a crop a few hundred pixels
    # across; this is for a small file that would inflate into a huge bitmap.
    max-pixels: 25000000
    min-side: 96
    quality: 0.85
    # Each decode holds up to max-pixels * 4 bytes of heap. An upload that waits longer is 503.
    parallel: 2
    queue-wait: 5s

  deletion:
    # How old the login behind DELETE /api/users/me may be. The site sends the reader through a login
    # right before the last button, so this only has to cover the way back to it.
    login-max-age: 5m

  erasure:
    # ISO-8601: @Scheduled reads this as a plain string and parses it itself, without Boot's
    # relaxed binding. The rest of this block goes through @ConfigurationProperties and does not.
    interval: PT1M
    # Added to the realm's access token lifespan to get the wait. More than the interval, so a token
    # issued a moment before an account was disabled has expired before anything is taken away.
    grace-margin: 2m
    # Nothing tells this service when a ban is lifted, so an address a ban is holding is asked about
    # again on this cadence rather than believed indefinitely.
    recheck: 5m
    # An account that keeps failing is looked at less and less often, up to the cap. Without this a
    # row that can never be finished is retried every minute for as long as the service runs.
    retry-backoff: 1m
    retry-cap: 1h
    # How long a departed reader's display name stays out of circulation.
    name-held: 30d
    lifespan-cache: 10m
    batch-size: 50

tw:
  media:
    # Where browsers fetch avatars from, straight from the bucket. Locally MinIO, path-style; in
    # production the bucket's own domain.
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:9000/avatars}
    endpoint: ${MEDIA_S3_ENDPOINT:http://localhost:9000}
    # R2 takes "auto"
    region: ${MEDIA_S3_REGION:us-east-1}
    bucket: ${MEDIA_BUCKET:avatars}
    access-key: ${MEDIA_S3_ACCESS_KEY:minioadmin}
    secret-key: ${MEDIA_S3_SECRET_KEY:minioadmin}
    # MinIO needs it, R2 accepts it
    path-style: true
    # A key is never reused, so what is under it never changes
    cache-control: public, max-age=31536000, immutable
    connect-timeout: 2s
    read-timeout: 5s

server:
  port: 8092
  # GET /internal/users carries up to 200 ids in its query string, about 7.4 KB. Tomcat counts the
  # request line against the header buffer, so with the caller's bearer token on top the default
  # 8 KB overflows and Tomcat answers 400 before the application ever sees the request.
  max-http-request-header-size: 16KB

logging:
  level:
    com.tenniswire.user_service: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

springdoc:
  # Off by default: the docs are not routed through the gateway and describe the
  # whole API to anyone who reaches the service port. The local profile turns them on.
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
