# Development profile: enables the OpenAPI docs at http://localhost:8092/swagger-ui.html.
# Not for a deployed environment. Same pattern as content-service and discussion-service.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Bound values carry user-written text and names: never outside local
logging:
  level:
    com.tenniswire.user_service: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
