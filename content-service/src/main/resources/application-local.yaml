# Development profile: enables the OpenAPI docs at http://localhost:8091/swagger-ui.html.
# Not for a deployed environment. Same pattern as the gateway's local profile.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Bound values carry user-written text and names: never outside local
logging:
  level:
    com.tenniswire.content_service: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
