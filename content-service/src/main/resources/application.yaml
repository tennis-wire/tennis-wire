spring:
  application:
    name: content-service

  datasource:
    # stringtype=unspecified is required: the schema uses native PostgreSQL enum
    # types (article_type, article_status, tag_type, media_type). Do not drop it.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tennis_content}?stringtype=unspecified
    username: ${DB_USERNAME:content}
    password: ${DB_PASSWORD:content}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  security:
    oauth2:
      resourceserver:
        jwt:
          # Same issuer and audience as the gateway: the service
          # validates the token itself rather than trusting whoever forwarded it.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/tennis-wire}
          audiences:
            - tennis-wire-api

server:
  port: 8091

media:
  # What an uploaded object's URL starts with. Written into article HTML, so in production this is
  # a domain of our own in front of the bucket: moving to another storage must not rewrite articles.
  public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:9000/media}
  max-pixels: 50000000
  s3:
    endpoint: ${S3_ENDPOINT_URL:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_MEDIA_BUCKET:media}
    # MinIO and most S3-compatible stores address a bucket by path, not by subdomain
    path-style: ${S3_PATH_STYLE:true}

logging:
  level:
    com.tenniswire.content_service: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

springdoc:
  # Off by default: the docs are not routed through the gateway and describe the
  # whole API to anyone who reaches the service port. The local profile turns them on.
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
