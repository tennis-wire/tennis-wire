spring:
  application:
    name: content-service

  datasource:
    # stringtype=unspecified is required: the schema uses native PostgreSQL enum
    # types (article_type, article_status, tag_type, media_type). Do not drop it.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tennis_content}?stringtype=unspecified
    username: ${DB_USERNAME:content}
    password: ${DB_PASSWORD:content}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8091

logging:
  level:
    com.tenniswire.content_service: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
