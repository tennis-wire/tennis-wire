# Docker Compose for local development
# Run: docker compose up -d

services:
  # ============== Redis ==============
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ============== MinIO (S3-compatible) ==============
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"  # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ============== Create Buckets ==============
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/transcription --ignore-existing;
      mc anonymous set download local/transcription;
      exit 0;
      "

  # ============== API Server (development) ==============
  # Uncomment to run in Docker instead of locally
  # api:
  #   build: .
  #   ports:
  #     - "8001:8001"
  #   environment:
  #     - APP_ENV=development
  #     - REDIS_URL=redis://redis:6379/0
  #     - S3_ENDPOINT_URL=http://minio:9000
  #     - S3_ACCESS_KEY=minioadmin
  #     - S3_SECRET_KEY=minioadmin
  #   depends_on:
  #     - redis
  #     - minio-init
  #   volumes:
  #     - ./src:/app/src:ro  # Hot reload

  # ============== Worker (development) ==============
  # Uncomment to run worker in Docker
  # worker:
  #   build: .
  #   command: python -m arq transcription.worker.tasks.WorkerSettings
  #   environment:
  #     - APP_ENV=development
  #     - REDIS_URL=redis://redis:6379/0
  #     - S3_ENDPOINT_URL=http://minio:9000
  #     - S3_ACCESS_KEY=minioadmin
  #     - S3_SECRET_KEY=minioadmin
  #     - WHISPER_DEVICE=cpu  # Use GPU in production
  #     - WHISPER_MODEL=tiny  # Use large-v3 in production
  #   depends_on:
  #     - redis
  #     - minio-init
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]

volumes:
  redis_data:
  minio_data:
