server:
  port: 8090

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/tennis-wire}
          # aud comes from the per-client audience mapper. Boot builds
          # the validator from this property, so there is no code for it.
          audiences:
            - tennis-wire-api

  cloud:
    gateway:
      server:
        webflux:
          # Global defaults
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

          routes:
            # ===== Editorial services =====

            - id: editorial-bff-ai
              uri: http://localhost:8080
              predicates:
                - Path=/api/ai/**
              metadata:
                response-timeout: 120000  # 2 min — SSE streaming from Claude
                connect-timeout: 5000

            - id: editorial-bff-translate
              uri: http://localhost:8080
              predicates:
                - Path=/api/translate/**

            - id: transcription-service
              uri: http://localhost:8001
              predicates:
                - Path=/api/transcribe/**

            # ===== Content Service =====

            - id: content-editorial
              uri: http://localhost:8091
              predicates:
                - Path=/api/editorial/**

            - id: content-public
              uri: http://localhost:8091
              predicates:
                - Path=/api/public/**

            # ===== Discussion Service =====

            - id: discussion-service
              uri: http://localhost:8093
              predicates:
                - Path=/api/discussion/**

            # ===== User Service =====

            # /api/users/** only. /internal/** is deliberately absent and must stay that way:
            # resolve and the batch lookup are reached over cluster DNS, never through the public
            # ingress
            - id: user-service
              uri: http://localhost:8092
              predicates:
                - Path=/api/users/**

            # ===== Other services (TODO) =====

            # - id: search-service
            #   uri: http://localhost:8094
            #   predicates:
            #     - Path=/api/search/**

            # - id: aggregator-service
            #   uri: http://localhost:8095
            #   predicates:
            #     - Path=/api/aggregator/**

# Actuator — health check and info
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      # Anonymous probes get a bare UP; details need a token with the admin role.
      show-details: when-authorized
      roles: admin
