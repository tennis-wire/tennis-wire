server:
  port: 8090

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/tennis-wire}
          # aud comes from the per-client audience mapper. Boot builds
          # the validator from this property, so there is no code for it.
          audiences:
            - tennis-wire-api

  cloud:
    gateway:
      server:
        webflux:
          # Global defaults
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

          routes:
            # ===== Editorial services =====

            - id: editorial-bff-ai
              uri: http://localhost:8080
              predicates:
                - Path=/api/ai/**
              metadata:
                response-timeout: 120000  # 2 min: SSE streaming from Claude
                connect-timeout: 5000

            - id: editorial-bff-translate
              uri: http://localhost:8080
              predicates:
                - Path=/api/translate/**

            - id: transcription-service
              uri: http://localhost:8001
              predicates:
                - Path=/api/transcribe/**

            # ===== Content Service =====

            - id: content-editorial
              uri: http://localhost:8091
              predicates:
                - Path=/api/editorial/**

            - id: content-public
              uri: http://localhost:8091
              predicates:
                - Path=/api/public/**

            # ===== Discussion Service =====

            # /api/discussion/** only. /internal/** is deliberately absent and must stay that way,
            # as for user-service below: the erase endpoint is reached over cluster DNS.
            #
            # Split by method so that reading and writing do not share a bucket, and reports keep
            # one of their own: it is the only write a reader aims at someone else. Reports also
            # match the write route below, so the order decides between them rather than the
            # position in this list.
            - id: discussion-reports
              uri: http://localhost:8093
              order: -1
              predicates:
                - Path=/api/discussion/comments/*/reports
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@readerOrAddressKeyResolver}"
                    rate-limiter: "#{@reportRateLimiter}"
                    deny-empty-key: false

            - id: discussion-writes
              uri: http://localhost:8093
              predicates:
                - Path=/api/discussion/**
                - Method=POST,PUT,PATCH,DELETE
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@readerOrAddressKeyResolver}"
                    rate-limiter: "#{@writeRateLimiter}"
                    deny-empty-key: false

            - id: discussion-reads
              uri: http://localhost:8093
              predicates:
                - Path=/api/discussion/**
                - Method=GET
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@readerOrAddressKeyResolver}"
                    rate-limiter: "#{@readRateLimiter}"
                    deny-empty-key: false

            # ===== User Service =====

            # /api/users/** only. /internal/** is deliberately absent and must stay that way:
            # resolve and the batch lookup are reached over cluster DNS, never through the public
            # ingress
            # Not split by method: everything here needs a token, so the key is always the
            # reader, and reading one's own profile is not a different kind of traffic from
            # renaming oneself.
            - id: user-service
              uri: http://localhost:8092
              predicates:
                - Path=/api/users/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@readerOrAddressKeyResolver}"
                    rate-limiter: "#{@writeRateLimiter}"
                    deny-empty-key: false

            # ===== Other services (TODO) =====

            # - id: search-service
            #   uri: http://localhost:8094
            #   predicates:
            #     - Path=/api/search/**

            # - id: aggregator-service
            #   uri: http://localhost:8095
            #   predicates:
            #     - Path=/api/aggregator/**

# Short windows only. The per-account ceilings (40 comments an hour, 8 reports an hour and the
# rest of the rules' anti-spam limits) are not expressible as one token bucket and need what the
# gateway does not have: the reader's account age and the text he is about to post. They belong in
# discussion-service and are not part of this.
#
# A rate slower than one a second is written as a request that costs several tokens: reports
# replenish at 1/s and cost 5, which is one report every five seconds with two allowed back to back.
gateway:
  rate-limit:
    # How many proxies append to X-Forwarded-For in front of the gateway. Raise it the day a CDN
    # goes in front of the ingress, or every anonymous reader ends up sharing the CDN's bucket.
    trusted-proxies: 1
    writes:
      replenish-rate: 1
      burst-capacity: 10
      requested-tokens: 1
    reads:
      replenish-rate: 5
      burst-capacity: 20
      requested-tokens: 1
    reports:
      replenish-rate: 1
      burst-capacity: 10
      requested-tokens: 5

# Actuator: health check and info
management:
  endpoints:
    web:
      exposure:
        include: health, info
  health:
    redis:
      # Off deliberately. The rate limiter fails open (a request the limiter cannot count goes
      # through), so Redis being unreachable costs the counting and nothing else. Left on, it would
      # turn the gateway DOWN and take the whole site out of rotation over a degraded guardrail.
      enabled: false
  endpoint:
    health:
      # Anonymous probes get a bare UP; details need a token with the admin role.
      show-details: when-authorized
      roles: admin
