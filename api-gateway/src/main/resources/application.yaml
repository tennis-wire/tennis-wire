server:
  port: 8090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          # Global defaults
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

          routes:
            # ===== Editorial services =====

            - id: editorial-bff-ai
              uri: http://localhost:8080
              predicates:
                - Path=/api/ai/**
              metadata:
                response-timeout: 120000  # 2 min — SSE streaming from Claude
                connect-timeout: 5000

            - id: editorial-bff-translate
              uri: http://localhost:8080
              predicates:
                - Path=/api/translate/**

            - id: transcription-service
              uri: http://localhost:8001
              predicates:
                - Path=/api/transcribe/**

            # ===== Content Service =====

            - id: content-editorial
              uri: http://localhost:8091
              predicates:
                - Path=/api/editorial/**

            - id: content-public
              uri: http://localhost:8091
              predicates:
                - Path=/api/public/**

            # ===== Other services (TODO) =====

            # - id: user-service
            #   uri: http://localhost:8092
            #   predicates:
            #     - Path=/api/users/**, /api/auth/**

            # - id: comments-service
            #   uri: http://localhost:8093
            #   predicates:
            #     - Path=/api/comments/**

            # - id: search-service
            #   uri: http://localhost:8094
            #   predicates:
            #     - Path=/api/search/**

            # - id: aggregator-service
            #   uri: http://localhost:8095
            #   predicates:
            #     - Path=/api/aggregator/**

      # CORS configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:5173"    # Vite dev server
              # - "https://tenniswire.com" # production (TODO)
            allowed-methods:
              - GET
              - POST
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - Content-Type
              - Authorization
            allow-credentials: true
            max-age: 3600

# Actuator — health check and info
management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always
