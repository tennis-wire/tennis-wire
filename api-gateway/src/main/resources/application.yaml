server:
  port: 8090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          # Global defaults
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

          routes:
            # ===== Editorial services =====

            - id: editorial-bff-ai
              uri: http://localhost:8080
              predicates:
                - Path=/api/ai/**
              metadata:
                response-timeout: 120000  # 2 min — SSE streaming from Claude
                connect-timeout: 5000

            - id: editorial-bff-translate
              uri: http://localhost:8080
              predicates:
                - Path=/api/translate/**

            - id: transcription-service
              uri: http://localhost:8001
              predicates:
                - Path=/api/transcribe/**

            # ===== Public services (TODO) =====

            # - id: content-service
            #   uri: http://localhost:8081
            #   predicates:
            #     - Path=/api/content/**

            # - id: user-service
            #   uri: http://localhost:8082
            #   predicates:
            #     - Path=/api/users/**, /api/auth/**

            # - id: comments-service
            #   uri: http://localhost:8083
            #   predicates:
            #     - Path=/api/comments/**

            # - id: search-service
            #   uri: http://localhost:8084
            #   predicates:
            #     - Path=/api/search/**

            # - id: aggregator-service
            #   uri: http://localhost:8085
            #   predicates:
            #     - Path=/api/aggregator/**

# Actuator — health check and info
management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always
