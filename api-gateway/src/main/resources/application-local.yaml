# Debugging profile: exposes the gateway endpoint, which lists every route,
# predicate and filter. Not for a deployed environment.
#
# Exposure is only half of it — the endpoint also requires the admin role
# (SecurityConfig), so a token from Keycloak is needed to read it.
management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    gateway:
      access: read-only
