spring:
  application:
    name: discussion-service

  datasource:
    # stringtype=unspecified is required: the schema uses the native PostgreSQL enum
    # type block_mode and the ltree type. Do not drop it.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tennis_discussion}?stringtype=unspecified
    username: ${DB_USERNAME:discussion}
    password: ${DB_PASSWORD:discussion}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  security:
    oauth2:
      resourceserver:
        jwt:
          # Same issuer and audience as the gateway (auth.md §7): the service
          # validates the token itself rather than trusting whoever forwarded it.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/tennis-wire}
          audiences:
            - tennis-wire-api
      client:
        registration:
          # Calls made as this service rather than as the reader: GET /internal/users. The id is
          # UserServiceClientConfig.REGISTRATION_ID.
          user-service:
            provider: keycloak
            client-id: discussion-service
            client-secret: ${DISCUSSION_SERVICE_CLIENT_SECRET:dev-discussion-service-secret}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            # token-uri, not issuer-uri: an issuer is looked up while the context starts, and then
            # neither the service nor any @SpringBootTest comes up without Keycloak.
            token-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/tennis-wire}/protocol/openid-connect/token

server:
  port: 8093

discussion:
  user-service:
    # Called directly, never through the gateway: /internal/** is not routed there.
    base-url: ${USER_SERVICE_URL:http://localhost:8092}
    connect-timeout: 1s
    # No retry on this side. The client already retries once after 3 s (discussion-rules §3.19);
    # a second layer here would only double the wait before the 503 and add nothing.
    read-timeout: 2s

  report:
    # Open set on purpose (discussion-rules.md §10.5): anything outside it is a 400, and adding
    # a code is a config change rather than a migration.
    reasons: [spam, insult, hate, illegal, personal_data, other]
    # The key the reporter hash is taken under. It must be set outside development: without a
    # secret, the hash of (reader, comment) can be recomputed for every known reader, and author
    # ids are public. Rotating it only lets everyone report once more.
    hash-key: ${REPORT_HASH_KEY:dev-report-hash-key}

logging:
  level:
    com.tenniswire.discussion_service: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

springdoc:
  # Off by default: the docs are not routed through the gateway and describe the
  # whole API to anyone who reaches the service port. The local profile turns them on.
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
