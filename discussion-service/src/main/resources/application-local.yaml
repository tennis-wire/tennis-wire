# Development profile: enables the OpenAPI docs at http://localhost:8093/swagger-ui.html.
# Not for a deployed environment. Same pattern as content-service.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# smoke.sh posts as the same two readers within seconds, and both are newcomers on a fresh realm.
# Only the pace is off: links and repeated texts are refused here as anywhere.
discussion:
  posting:
    interval: 0s
    newcomer:
      interval: 0s

# Bound values carry user-written text and names: never outside local
logging:
  level:
    com.tenniswire.discussion_service: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
